<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>CSAT Survey Mock</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>CSAT Survey Mock</h1>

      <p>How satisfied are you with ObGyn Hub?</p>

      <label>
        <input type="radio" name="rating" value="5" />
        Very satisfied
      </label>

      <label>
        <input type="radio" name="rating" value="3" />
        Satisfied
      </label>

      <label>
        <input type="radio" name="rating" value="1" />
        Not satisfied
      </label>

      <div class="actions">
        <button id="complete">Submit Survey</button>
        <button id="cancel">Cancel</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
